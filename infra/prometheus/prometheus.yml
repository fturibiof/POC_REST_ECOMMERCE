# Scrape every 5 s: runs last a few minutes, a finer resolution than the
# 15 s of Docconnect is needed to see a 30 s outage.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # The five services (prom-client). Labels `service` and `option` come from the services.
  - job_name: services
    static_configs:
      - targets: ["order:3000", "payment:3001", "inventory:3002", "shipping:3003", "notification:3004"]

  # RabbitMQ (option B) — global metrics.
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  # Messages per queue: absent from /metrics, they need the detailed
  # endpoint (lesson from Docconnect, checked against a real broker).
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: ["queue_coarse_metrics"]
    static_configs:
      - targets: ["rabbitmq:15692"]

  # CPU and memory per container (hypothesis H4).
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
